services:
  - type: web
    name: mule-ai-validation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_TIMEOUT_SECONDS
        value: "45"
