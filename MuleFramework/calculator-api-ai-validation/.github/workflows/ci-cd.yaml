name: calculator-api-ai-validation-ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-validation-service
  CALC_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/calculator-api

jobs:
  # ============================================================
  # 1. BUILD
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build Mule app
        working-directory: mule-app
        run: mvn -B -DskipMunitTests=true clean package
      - name: Upload Mule artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-app-jar
          path: mule-app/target/*.jar
          retention-days: 7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-validation-service/requirements.txt
      - name: Install AI service deps
        working-directory: ai-validation-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  # ============================================================
  # 2. UNIT TEST (python AI service)
  # ============================================================
  unit-test:
    name: Unit Test (AI Service)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-validation-service/requirements.txt
      - name: Install deps
        working-directory: ai-validation-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Run unit tests
        working-directory: ai-validation-service
        run: pytest --cov=app --cov-report=xml --cov-fail-under=70 -q

  # ============================================================
  # 3. MUNIT
  # ============================================================
  munit-test:
    name: MUnit Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run MUnit tests with coverage
        working-directory: mule-app
        run: mvn -B test
      - name: Upload MUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munit-reports
          path: |
            mule-app/target/surefire-reports/**/*.xml
            mule-app/target/site/munit/coverage/**

  # ============================================================
  # 4. AI VALIDATION
  # ============================================================
  ai-validation:
    name: AI Validation
    runs-on: ubuntu-latest
    needs: munit-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-validation-service/requirements.txt
      - name: Install deps
        working-directory: ai-validation-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download MUnit reports
        uses: actions/download-artifact@v4
        with:
          name: munit-reports
          path: ai-validation-service/munit-reports
        continue-on-error: true
      - name: Run AI validation pipeline
        working-directory: ai-validation-service
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.services.workflow import run_pipeline
          import json, sys
          reports = Path("munit-reports") if Path("munit-reports").exists() else Path("sample_reports")
          result = run_pipeline(
              munit_reports_dir=reports,
              raml_path=Path("../mule-app/src/main/resources/api/calculator-api.raml"),
              mule_xml_dir=Path("../mule-app/src/main/mule"),
          )
          dash = result["dashboard"].model_dump()
          print(json.dumps(dash, indent=2))
          Path("dashboard.json").write_text(json.dumps(dash, indent=2))
          if dash["recommendation"] == "BLOCKED":
              sys.exit(1)
          PY
      - name: Upload executive dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-dashboard
          path: ai-validation-service/dashboard.json

  # ============================================================
  # 5. DOCKER BUILD AND PUSH
  # ============================================================
  docker:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: ai-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push AI service image
        uses: docker/build-push-action@v6
        with:
          context: ai-validation-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # ============================================================
  # 6. DEPLOY DEV
  # ============================================================
  deploy-dev:
    name: Deploy DEV
    runs-on: ubuntu-latest
    needs: docker
    environment: dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Apply manifests
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DEV }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ai-validation-service.yaml
          kubectl set image deployment/ai-validation-service \
            ai-validation=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n calculator-ai

  # ============================================================
  # 7. DEPLOY QA
  # ============================================================
  deploy-qa:
    name: Deploy QA
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Apply manifests
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_QA }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ai-validation-service.yaml
          kubectl set image deployment/ai-validation-service \
            ai-validation=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n calculator-ai

  # ============================================================
  # 8. DEPLOY PROD (gated by environment approval)
  # ============================================================
  deploy-prod:
    name: Deploy PROD
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Apply manifests
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ai-validation-service.yaml
          kubectl set image deployment/ai-validation-service \
            ai-validation=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n calculator-ai
