---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-api
  namespace: calculator-ai
  labels:
    app: calculator-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: calculator-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: calculator-api
    spec:
      containers:
        - name: calculator-api
          # Built from mule-app via Anypoint Runtime Fabric / CloudHub 2.0 deployer.
          # For local Kubernetes runs use a base image with Mule 4.9 + this app deployed.
          image: ghcr.io/example/calculator-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: env
              value: "prod"
            - name: runtime.encryption.key
              valueFrom:
                secretKeyRef:
                  name: calculator-api-secrets
                  key: encryption-key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /calculator/v1/console
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-api
  namespace: calculator-ai
spec:
  selector:
    app: calculator-api
  ports:
    - name: http
      port: 80
      targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: calculator-api-secrets
  namespace: calculator-ai
type: Opaque
stringData:
  encryption-key: "REPLACE_WITH_REAL_KEY"
