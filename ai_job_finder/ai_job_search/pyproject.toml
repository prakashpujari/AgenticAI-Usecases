[project]
name = "ai_job_search"
version = "0.1.0"
description = "AI/ML Job Search Automation using CrewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.1",
    "requests>=2.31.0",
    "pydantic>=2.0.0"
]

[project.scripts]
ai_job_search = "ai_job_search.main:run"
run_crew = "ai_job_search.main:run"
train = "ai_job_search.main:train"
replay = "ai_job_search.main:replay"
test = "ai_job_search.main:test"
run_with_trigger = "ai_job_search.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
