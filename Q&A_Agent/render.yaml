services:
  - type: web
    name: qa-agent-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false                        # set manually in Render dashboard
      # Google Gemini — free fallback when Groq quota is exhausted
      # Free key at https://aistudio.google.com/apikey (no credit card)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: NUM_QUESTIONS
        value: "10"
      - key: LOG_TO_FILE
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: REDIS_URL
        value: redis://red-d836e2t7vvec73938sl0:6379
      # Rate limiting
      - key: RATE_LIMIT_MAX
        value: "10"
      - key: RATE_LIMIT_WINDOW
        value: "3600"
      - key: BURST_MAX
        value: "3"
      - key: GLOBAL_LLM_MAX
        value: "100"
      # Security — set a strong random secret in Render dashboard
      - key: IDENTITY_HMAC_SECRET
        sync: false
      # YouTube transcripts — Option A (recommended): sign up free at supadata.ai
      # and set SUPADATA_API_KEY. Option B: base64-encoded Netscape cookies.txt
      # from a logged-in YouTube session (export from browser + base64 -w0 cookies.txt)
      - key: SUPADATA_API_KEY
        sync: false                        # set manually in Render dashboard
      - key: YOUTUBE_COOKIES
        sync: false                        # set manually in Render dashboard
      - key: YOUTUBE_PROXY_URL
        sync: false                        # optional: socks5://host:port or http://user:pass@host:port
      # PostgreSQL — external Render DB for persistent stats (survives sleep/restart)
      - key: DATABASE_URL
        value: "postgresql://ai_apps_db_nzf4_user:upzKUnedEMR1EvhNJsiltS1SGnoBzE3F@dpg-d84sbagjo89c73bskf10-a.oregon-postgres.render.com/ai_apps_db_nzf4?sslmode=require"
      # LangSmith tracing — sign up free at https://smith.langchain.com
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: qa-agent
      - key: LANGCHAIN_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGCHAIN_API_KEY
        sync: false                        # set manually in Render dashboard
      # CORS — set to your exact Vercel domain
      - key: CORS_ALLOWED_ORIGIN
        value: "https://frontend-six-red-29.vercel.app"
