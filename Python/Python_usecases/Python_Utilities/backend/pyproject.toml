[tool.poetry]
name = "mortgage-platform"
version = "0.1.0"
description = "Internal Mortgage Utilities Platform"
authors = ["Platform Team <platform@mortgagecompany.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {extras = ["all"], version = "^0.111.0"}
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.7.1"
pydantic-settings = "^2.3.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
aiosqlite = "^0.20.0"
alembic = "^1.13.1"
redis = {extras = ["asyncio"], version = "^5.0.4"}
structlog = "^24.2.0"
opentelemetry-api = "^1.25.0"
opentelemetry-sdk = "^1.25.0"
opentelemetry-instrumentation-fastapi = "^0.46b0"
opentelemetry-instrumentation-sqlalchemy = "^0.46b0"
opentelemetry-instrumentation-httpx = "^0.46b0"
tenacity = "^8.3.0"
httpx = "^0.27.0"
prometheus-fastapi-instrumentator = "^7.0.0"
python-multipart = "^0.0.9"
email-validator = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
anyio = "^4.4.0"
respx = "^0.21.1"
fakeredis = {extras = ["aioredis"], version = "^2.23.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
