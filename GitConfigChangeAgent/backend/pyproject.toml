[tool.poetry]
name = "gitconfigchangeagent-backend"
version = "0.1.0"
description = "FastAPI backend for GitLab configuration change orchestration."
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.0"
uvicorn[standard] = "^0.23.0"
httpx = "^0.28.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.28.0"
pydantic = "^2.6.0"
loguru = "^0.7.0"
prometheus-client = "^0.17.0"
opentelemetry-api = "^1.23.0"
opentelemetry-sdk = "^1.23.0"
opentelemetry-instrumentation-fastapi = "^0.41.0"
opentelemetry-exporter-otlp = "^1.23.0"
langchain = "^0.1.0"
langsmith = "^0.1.0"
pinecone-client = "^2.0.0"
python-jose[cryptography] = "^4.16.0"

[tool.poetry.dev-dependencies]
pytest = "^8.4.0"
httpx = "^0.28.0"
black = "^24.9.0"
isort = "^6.0.0"

[tool.poetry.scripts]
start-backend = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
