# docker-compose.yml — local development
# Runs backend and frontend dev servers with volume mounts for hot reload.
#
# Usage:
#   docker compose up
#   docker compose up --build   (after dependency changes)
#
# Requires: .env at project root (see .env.example)

version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: builder          # use the builder stage so changes rebuild fast
    command: >
      uvicorn backend.main:app
        --host 0.0.0.0 --port 8000
        --reload --log-level info
    volumes:
      - ./backend:/app/backend  # hot-reload in dev
    env_file: .env
    environment:
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules        # anonymous volume prevents host override
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""           # empty = same-origin proxy to Vite's proxy rules
    depends_on:
      backend:
        condition: service_healthy
