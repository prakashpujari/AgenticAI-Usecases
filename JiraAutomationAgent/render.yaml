services:
  - type: web
    name: jira-automation-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: |
      pip install -r backend/requirements.txt
      python -m spacy download en_core_web_lg
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: jira-issues
      - key: REDIS_URL
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        sync: false
      - key: ALLOWED_PROJECTS
        sync: false
      - key: MAX_REVIEW_ITERATIONS
        value: 2
      - key: DEDUPE_THRESHOLD
        value: 0.90
