# nginx/nginx.conf
# Serves the React SPA and reverse-proxies /ai/* and /health to the backend.

upstream backend {
    # "backend" must match the service name in docker-compose.yml
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Security headers (duplicates what FastAPI sets, belt-and-suspenders) ──
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "DENY"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # In production behind an HTTPS load balancer, uncomment:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Request limits ────────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_types      application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # ── API reverse proxy ─────────────────────────────────────────────────────
    location /ai/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Long timeout: pipeline can take 60-90 s
        proxy_read_timeout    180s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
    }

    location /health {
        proxy_pass         http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout  10s;
    }

    # ── React SPA — serve static files, fallback to index.html ───────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite content-hashes filenames)
        location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html must not be cached so new deployments take effect immediately
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
