apiVersion: v1
kind: Namespace
metadata:
  name: aiops

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-config
  namespace: aiops
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  MILVUS_HOST: milvus-service
  MILVUS_PORT: "19530"
  PROMETHEUS_URL: http://prometheus-service:9090
  JAEGER_HOST: jaeger-service
  JAEGER_PORT: "6831"

---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://aiops:aiops@postgres-service:5432/aiops_db
  REDIS_URL: redis://redis-service:6379
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
  DATADOG_API_KEY: ${DATADOG_API_KEY}
  DATADOG_APP_KEY: ${DATADOG_APP_KEY}
  SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD}
  JIRA_API_TOKEN: ${JIRA_API_TOKEN}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aiops
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: aiops
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiops-secrets
              key: DATABASE_URL
        - name: POSTGRES_DB
          value: aiops_db
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: aiops
spec:
  selector:
    app: postgres
  clusterIP: None
  ports:
  - port: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: aiops
spec:
  selector:
    app: redis
  ports:
  - port: 6379
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-backend
  namespace: aiops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aiops-backend
  template:
    metadata:
      labels:
        app: aiops-backend
    spec:
      containers:
      - name: backend
        image: aiops-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: aiops-config
        - secretRef:
            name: aiops-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-backend-service
  namespace: aiops
spec:
  selector:
    app: aiops-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-frontend
  namespace: aiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-frontend
  template:
    metadata:
      labels:
        app: aiops-frontend
    spec:
      containers:
      - name: frontend
        image: aiops-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
        env:
        - name: VITE_API_URL
          value: http://aiops-backend-service:8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: aiops-frontend-service
  namespace: aiops
spec:
  selector:
    app: aiops-frontend
  ports:
  - port: 80
    targetPort: 5173
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiops-backend-hpa
  namespace: aiops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiops-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
